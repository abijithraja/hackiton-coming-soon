<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta -->
  <title>HackITon'26 — We're Cooking</title>
  <meta name="description" content="HackITon'26 by InvaderZ — Something awesome is cooking. Stay tuned." />
  <meta name="keywords" content="HackITon, InvaderZ, Hackathon 2026, Coming Soon, HackITon.in" />
  <meta name="author" content="InvaderZ" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hackiton.in/" />
  <meta property="og:title" content="HackITon'26 | InvaderZ" />
  <meta property="og:description" content="HackITon'26 by InvaderZ — Something awesome is cooking. Stay tuned." />
  <meta property="og:image" content="https://hackiton.in/assets/invaderz-logo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://hackiton.in/" />
  <meta name="twitter:title" content="HackITon'26 | InvaderZ" />
  <meta name="twitter:description" content="HackITon'26 by InvaderZ — Something awesome is cooking. Stay tuned." />
  <meta name="twitter:image" content="https://hackiton.in/assets/invaderz-logo.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/invaderz-logo.png" />
  <link rel="apple-touch-icon" href="assets/invaderz-logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background orbs -->
  <div class="bg-orb bg-orb--gold" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--cyan" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--gold2" aria-hidden="true"></div>

  <!-- Noise texture overlay -->
  <div class="noise-overlay" aria-hidden="true"></div>

  <main class="page-wrapper">

    <!-- LOGO SECTION -->
    <section class="logo-section" aria-label="InvaderZ logo">
      <div class="logo-ring" id="logo-ring">
        <img
          src="assets/invaderz-logo.png"
          alt="InvaderZ Logo"
          class="logo-img"
          id="logo-img"
          draggable="false"
        />
      </div>
    </section>

    <!-- HERO SECTION -->
    <section class="hero-section" aria-label="Hero section">

      <!-- Chad Cat -->
      <div class="cat-wrapper" id="cat-wrapper">
        <div class="cat-glow-ring" aria-hidden="true"></div>
        <img
          src="assets/chad-cat.png"
          alt="Chad cat chef cooking something legendary"
          class="cat-img"
          id="cat-img"
          draggable="false"
        />
      </div>

      <!-- Main Heading -->
      <div class="heading-wrapper" id="heading-wrapper">
        <h1 class="main-heading">
          <span class="heading-white">Wait bro, we're&nbsp;</span><span class="heading-gold">cooking!</span>
        </h1>
      </div>

      <!-- Supporting text -->
      <p class="support-text" id="support-text">
        Our domain is under process.<br />
        Something awesome is on the way.
      </p>

      <!-- Divider -->
      <div class="divider" id="divider" aria-hidden="true">
        <span class="divider-line"></span>
        <span class="divider-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="pot-icon" aria-label="cooking pot">
            <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/>
            <path d="M9 9V7a3 3 0 0 1 6 0v2"/>
            <path d="M3 9h-.5a1.5 1.5 0 0 0 0 3H3"/>
            <path d="M21 9h.5a1.5 1.5 0 0 1 0 3H21"/>
          </svg>
        </span>
        <span class="divider-line"></span>
      </div>

      <!-- Status Card -->
      <div class="status-card" id="status-card">
        <div class="status-label">CURRENT STATUS</div>
        <div class="status-main">We're cooking<span class="status-dots"></span></div>
        <div class="status-badge">
          <span class="badge-dot" aria-hidden="true"></span>
          Coming Soon
        </div>
      </div>

      <!-- Bottom message -->
      <div class="bottom-message" id="bottom-message">
        <span class="rocket-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="rocket-svg">
            <path d="M4.5 16.5c-1.5 1.5-2 5-2 5s3.5-.5 5-2l3-3-3-3-3 3z"/>
            <path d="M15 2s4.5 1.5 6 6-4.5 9-10.5 9L15 2z"/>
            <circle cx="14" cy="10" r="1.5"/>
          </svg>
        </span>
        <p class="bottom-text">Stay tuned. It's worth the wait.</p>
      </div>

      <!-- HackITon Branding -->
      <div class="brand-signature" id="brand-signature">
        <span class="brand-year">HACKITON<span class="brand-apostrophe">'</span>26</span>
        <span class="brand-dot" aria-hidden="true">·</span>
        <a href="https://hackiton.in" class="brand-domain" aria-label="Visit hackiton.in">hackiton.in</a>
      </div>

    </section>

    <!-- FOOTER -->
    <footer class="site-footer" role="contentinfo">
      <p class="footer-text">© 2026 InvaderZ &bull; HackITon</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
